<!--
    Box Model
    Every element is a rectangle with the following attributes:
        - Margin
        - Border
        - Padding
        - Content
-->
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Document</title>

    <style>
        .box {
            align-content: center;
            text-align: center;
            font-weight: bold;
            font-size: 2rem;

            background-color: darkorange;
            color: #333;

            width: 280px;
            height: 280px;

            border: 1rem solid black;
        }
    </style>
    
</head>
<body>

<div class="box">
    Content
</div>

</body>
</html>
