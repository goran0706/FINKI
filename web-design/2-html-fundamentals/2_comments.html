<!--
    Comments in HTML are ignored and not displayed on the interface.
    Comments however may appear in the browser source file when inspected.

    Comments in HTML start from  < !-- and end with -- >
    Comments in HTML cannot be nested (notice the spacing above).

    Comments in HTML can be used:
    - inline
    - single line
    - multiple line
-->

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Document</title>

</head>
<body>

<!-- This comment will not appear on the screen -->
<h1>Comments in CSS</h1>

<!-- Do not use comment to state the obvious -->
<p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Error, optio?</p>

</body>
</html>
