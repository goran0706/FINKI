<!--
    HTML elements can be nested (this means that elements can contain other elements).

    All HTML documents consist of nested HTML elements.

    Even the most basic document structure contains nested elements.
    The <html> is the root elements that nests head and body.

    Nested Elements are elements that appear inside other elements and create more complex elements or components.

    There are some rules to nesting elements:

    - Block elements can appear inside other block elements
    - Block elements cannot appear inside other inline elements

    - Inline elements can appear inside other block elements
    - Inline elements can appear inside other inline elements

    - Proper opening and closing tags usage - don't mix and match, a closing tag must pair with an opening tag before
    any other opening tag appears.
-->
