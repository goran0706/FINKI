<!--
    Global Attributes — id and class

    All HTML elements can have attributes.
    Attributes provide additional information about elements.
    Attributes are always specified in the start tag.
    Attributes usually come in name/value pairs like: name="value".

-->

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Document</title>
</head>
<body>

<h1 id="title">Heading 1</h1>
<h2 class="subtitle">Heading 2</h2>
<h3>Heading 3</h3>
<p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Ad blanditiis corporis delectus dolore doloribus enim esse
    et excepturi iusto labore mollitia nisi odio sit ullam, voluptas. Adipisci dignissimos ea ipsam?
</p>

</body>
</html>
