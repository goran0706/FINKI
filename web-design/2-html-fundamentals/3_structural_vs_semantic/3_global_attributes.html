#### Exercise 3.3: Global Attributes

Add appropriate global attributes to this markup:

```html

<article>  <!-- Add id -->
    <h2>Article Title</h2>  <!-- Add class for styling -->
    <p>Content in English</p>
    <p>Contenu en français</p>  <!-- Add lang attribute -->
    <button>Delete</button>  <!-- Add data-action and data-item-id attributes -->
</article>
```

<article id="article">  <!-- Add id -->
    <h2 class="article_title">Article Title</h2>  <!-- Add class for styling -->
    <p>Content in English</p>
    <p lang="fr">Contenu en français</p>  <!-- Add lang attribute -->
    <button data-action="delete" data-item-id="10">Delete</button>  <!-- Add data-action and data-item-id attributes -->
</article>
