#### Exercise 3.1: Semantic HTML Conversion

Convert this div-based layout to use proper HTML5 semantic elements:

```html
<div class="header">
    <div class="navigation">
        <a href="/">Home</a>
        <a href="/about">About</a>
    </div>
</div>
<div class="main-content">
    <div class="article">
        <h2>Article Title</h2>
        <p>Article content...</p>
    </div>
    <div class="sidebar">
        <h3>Related Links</h3>
    </div>
</div>
<div class="footer">
    <p>Copyright 2026</p>
</div>
```

<header class="header">
    <nav class="navigation">
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/about">About</a></li>
        </ul>
    </nav>
</header>
<main class="main-content">
    <article class="article">
        <h2>Article Title</h2>
        <p>Article content...</p>
    </article>
    <aside class="sidebar">
        <h3>Related Links</h3>
    </aside>
</main>
<footer class="footer">
    <p>Copyright 2026</p>
</footer>
