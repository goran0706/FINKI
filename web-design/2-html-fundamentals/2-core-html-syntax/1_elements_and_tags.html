<!--#### Exercise 2.1: Elements and Tags-->

<!--Identify which of the following are void elements (self-closing) and which require closing tags:-->

<!--1. `<p>`-->
<!--2. `<img>`-->
<!--3. `<br>`-->
<!--4. `<div>`-->
<!--5. `<input>`-->
<!--6. `<meta>`-->
<!--7. `<section>`-->
<!--8. `<hr>`-->

<!--
    CONTAINER ELEMENTS:
        <p> Content </p>
        <div> Content </div>
        <section> Content </section>

    SELF-CLOSING ELEMENTS:
        <img>
        <br>
        <hr>
        <input>
        <meta>
-->

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Document</title>
</head>
<body>
<!-- CONTAINER -->
<p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Eius, laboriosam.</p>
<div>
    <h1>Lorem ipsum dolor.</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Nostrum, sapiente!</p>
</div>
<section>
    <h2>Lorem ipsum dolor.</h2>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Nostrum, sapiente!</p>
</section>

<!-- SELF-CLOSING -->
<img alt="alternative text if image does not load" src="URL">
<br>
<hr>
<label>
    Name:
    <input type="text">
</label>
</body>
</html>
