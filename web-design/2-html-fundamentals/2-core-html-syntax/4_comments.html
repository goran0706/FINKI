#### Exercise 2.4: HTML Comments

Add comments to this code to document what each section does:

```html
<!-- Header Section - creates a semantic header container that contains the main navigation links -->
<header>
    <!-- Creates a h1 heading with the content Site Title -->
    <h1>Site Title</h1>
    <!-- Creates a semantic nav container to contain the main navigation links -->
    <nav>
        <!-- Unordered list with link to different pages -->
        <ul>
            <!-- List item containing th actual links (anchor elements) -->
            <li><a href="/">Home</a></li>
        </ul>
    </nav>
</header>
```
