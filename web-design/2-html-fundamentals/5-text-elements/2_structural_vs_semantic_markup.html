<!--#### Exercise 5.2: Structural vs Semantic Markup-->

<!--Create a code example that demonstrates the difference between:-->

<!-- - `<b>` vs `<strong>`-->
<!-- - `<i>` vs `<em>`-->

<!--Write a sentence for each pair showing when to use which.-->
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Document</title>
</head>
<body>
<p>
    <b>bold - provides bold visualization, but no semantic meaning</b>
    <br>
    <strong>strong - provides bold visualization with semantic meaning</strong>
</p>

<p>
    <i>italic - provides bold visualization, but no semantic meaning</i>
    <br>
    <em>emphasizes - provides bold visualization with semantic meaning</em>
</p>

</body>
</html>
