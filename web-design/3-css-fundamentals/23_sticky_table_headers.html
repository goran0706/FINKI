<!--
#### Exercise 5.4: Sticky Table Headers

Create a table with sticky headers that stay visible when scrolling the table body.
-->

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Document</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        thead {
            background-color: #000;
            color: #fff;
            height: 40px;
            position: sticky;
            top: 0;
        }

        th {
            padding: 16px !important;
        }

        tbody {
            height: 200vh;
        }

        tbody tr:nth-child(odd) {
            background-color: darkgray;
        }
    </style>
</head>
<body>
<table>
    <thead>
    <tr>
        <th>Product</th>
        <th>Price</th>
        <th>Quantity</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td>Apple</td>
        <td>$100</td>
        <td>1</td>
    </tr>
    <tr>
        <td>Banana</td>
        <td>$50</td>
        <td>2</td>
    </tr>
    <tr>
        <td>Cherry</td>
        <td>$25</td>
        <td>3</td>
    </tr>
    </tbody>
</table>
</body>
</html>
