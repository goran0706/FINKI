<!--
#### Exercise 8.2: Fractional Units

Create a 4-column grid where:

- Column 1: 1fr
- Column 2: 2fr (twice as wide as column 1)
- Column 3: 1fr
- Column 4: 1fr
-->

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Basic Grid</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            padding: 1rem;
            font-family: sans-serif;
        }

        .grid-container {
            display: grid;

            /* 3 columns */
            grid-template-columns: 1fr 2fr 1fr 1fr;

            gap: 16px;

            width: 100%;
            background-color: #e0e0e0;
            padding: 1rem;
            border-radius: 16px;
        }

        .grid-item {
            border-radius: 16px;
            background-color: dodgerblue;
            color: white;
            height: 80px;

            /* proper centering */
            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="grid-container">
    <div class="grid-item">1</div>
    <div class="grid-item">2</div>
    <div class="grid-item">3</div>
    <div class="grid-item">4</div>
</div>

</body>
</html>
