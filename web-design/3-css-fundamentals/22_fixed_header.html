<!--
#### Exercise 5.3: Fixed Header

Create a fixed header that:

- Stays at top when scrolling
- Full width
- Has content below that doesn't get hidden behind it
-->

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Document</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #888888;
            height: 400vh;
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #1a1a1a;
            color: #fff;
            position: fixed;
            top: 0;
            width: 100vw;
            height: 40px;

            z-index: 1;
        }

        nav ul {
            display: flex;
            justify-content: center;
            align-items: center;
            list-style: none;
        }

        nav ul li {
            padding-left: 10px;
        }

        a {
            text-decoration: none;
            color: #fff;
        }

        .box {
            width: 100px;
            height: 100px;
            position: absolute;
        }

        .box1 {
            background-color: crimson;
            top: 300px;
            left: 200px;
        }

        .box2 {
            background-color: dodgerblue;
            top: 600px;
            left: 300px;
        }

        .box3 {
            background-color: orange;
            top: 800px;
            left: 100px;
            z-index: 2;
        }
    </style>
</head>
<body>

<header>
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</header>

<div class="box box1"></div>
<div class="box box2"></div>
<div class="box box3"></div>
</body>
</html>
