<!--
#### Exercise 3.3: Inheritance

Which of these properties inherit by default?

1. `color`
2. `margin`
3. `font-family`
4. `border`
5. `line-height`
6. `background-color`
7. `text-align`
8. `padding`
-->

color → ✅ Inherited
font-family → ✅ Inherited
line-height → ✅ Inherited
text-align → ✅ Inherited

margin → ❌ Not inherited
border → ❌ Not inherited
padding → ❌ Not inherited
background-color → ❌ Not inherited
