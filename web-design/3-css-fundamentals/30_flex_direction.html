<!--
#### Exercise 7.2: Flex Direction

Create four examples showing:

1. `flex-direction: row` (default)
2. `flex-direction: row-reverse`
3. `flex-direction: column`
4. `flex-direction: column-reverse`
-->

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Document</title>
    <style>
        .flex {
            background-color: crimson;
            border-radius: 1rem;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            /*height: 200px;*/
            margin: 2rem;
            padding: 2rem;
        }

        .box {
            background-color: yellow;
            border-radius: 1rem;
            width: 100px;
            height: 100px;
            align-content: center;
            text-align: center;
            font-size: 3rem;
            font-weight: bold;
        }

        .direction-row {
            flex-direction: row;
        }

        .direction-row-reverse {
            flex-direction: row-reverse;
        }

        .direction-column {
            flex-direction: column;
        }

        .direction-column-reverse {
            flex-direction: column-reverse;
        }
    </style>
</head>
<body>

<div class="flex direction-row">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
</div>

<div class="flex direction-row-reverse">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
</div>

<div class="flex direction-column">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
</div>

<div class="flex direction-column-reverse">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
</div>

</body>
</html>
