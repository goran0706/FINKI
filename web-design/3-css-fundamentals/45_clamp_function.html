<!--
#### Exercise 9.4: clamp() Function

Create fluid typography:

h1 {
    font-size: clamp(1.5rem, 5vw, 3rem);
}

Test on different viewport sizes and verify:

- Never smaller than 1.5rem
- Never larger than 3rem
- Scales smoothly between
-->

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>

    <style>
        h1 { font-size: clamp(2rem, 5vw, 3.5rem); }
        h2 { font-size: clamp(1.75rem, 4vw, 3rem); }
        h3 { font-size: clamp(1.5rem, 3vw, 2.5rem); }
        h4 { font-size: clamp(1.25rem, 2.5vw, 2rem); }
        h5 { font-size: clamp(1.1rem, 2vw, 1.5rem); }
        h6 { font-size: clamp(1rem, 1.5vw, 1.25rem); }
    </style>
</head>
<body>

<h1>Heading 1</h1>
<h2>Heading 2</h2>
<h3>Heading 3</h3>
<h4>Heading 4</h4>
<h5>Heading 5</h5>
<h6>Heading 6</h6>


</body>
</html>
