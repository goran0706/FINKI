<!--
#### Exercise 8.3: Responsive Grid (auto-fit)

Create a responsive grid that automatically adjusts columns:

- Minimum column width: 250px
- Maximum: 1fr
- Columns fill available space
- Use `repeat(auto-fit, minmax(250px, 1fr))`
-->

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Basic Grid</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            padding: 1rem;
            font-family: sans-serif;
        }

        .grid-container {
            display: grid;

            /* 3 columns */
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

            gap: 16px;

            width: 100%;
            background-color: #e0e0e0;
            padding: 1rem;
            border-radius: 16px;
        }

        .grid-item {
            border-radius: 16px;
            background-color: dodgerblue;
            color: white;
            height: 80px;

            /* proper centering */
            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="grid-container">
    <div class="grid-item">1</div>
    <div class="grid-item">2</div>
    <div class="grid-item">3</div>
    <div class="grid-item">4</div>
</div>

</body>
</html>
