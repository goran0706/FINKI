<!--

#### Exercise 8.6: Explicit Placement

Place items at specific grid positions:

- Item 1: row 1, columns 1-3
- Item 2: row 2, column 1
- Item 3: row 2-4, column 2
- Item 4: row 3, column 3

Use line numbers for placement.

-->

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Basic Grid</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            grid-template-rows: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;

            height: 100vh;
            width: 100%;
            background-color: #e0e0e0;
            padding: 1rem;
            border-radius: 16px;
        }

        .grid-item {
            border-radius: 16px;
            background-color: dodgerblue;
            color: white;

            /* proper centering */
            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
        }

        .item1 {
            grid-row: 1;
            grid-column: 1/3;
        }

        .item2 {
            grid-row: 2;
            grid-column: 1;
        }

        .item3 {
            grid-row: 2/4;
            grid-column: 2;
        }

        .item4 {
            grid-row: 3;
            grid-column: 3;
        }
    </style>
</head>
<body>

<div class="grid-container">
    <div class="grid-item item1">1</div>
    <div class="grid-item item2">2</div>
    <div class="grid-item item3">3</div>
    <div class="grid-item item4">4</div>
</div>


</body>
</html>
