<!--
#### Exercise 7.3: Flex Wrapping

Create a responsive flex container:

- Items are 200px wide
- Container wraps when items don't fit
- Equal spacing between rows and columns
-->

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Document</title>

    <style>
        .flex-container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            height: 100%;
            background-color: azure;
            border-radius: 15px;
            gap: 1rem;
        }

        .flex-item {
            flex: 0 0 200px;
            height: 200px;
            color: white;
            background-color: dodgerblue;
            border-radius: 50%;
            text-align: center;
            align-content: center;
            font-size: 4rem;
            font-weight: bold;
        }
    </style>

</head>
<body>

<div class="flex-container">
    <div class="flex-item">1</div>
    <div class="flex-item">2</div>
    <div class="flex-item">3</div>
    <div class="flex-item">4</div>
    <div class="flex-item">5</div>
</div>

</body>
</html>
