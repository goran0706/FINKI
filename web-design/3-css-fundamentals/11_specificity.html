<!--
#### Exercise 3.1: Calculate Specificity

Calculate the specificity for these selectors:

1. `p`
2. `.class`
3. `#id`
4. `div p`
5. `.container .card`
6. `#header #id`
7. `#header .nav ul li`
8. `article > p.intro`
9. `.card:not(.featured)`
10. `nav ul li:first-child`
11. `#main .content article h2`
-->

<!--
    Specificity Calculation (ID - CLASS - TYPE)

    p                            → (0, 0, 1)
    .class                       → (0, 1, 0)
    #id                          → (1, 0, 0)

    div p                        → (0, 0, 2)
    .container .card             → (0, 2, 0)
    #header #id                  → (2, 0, 0)

    #header .nav ul li           → (1, 1, 2)
    article > p.intro            → (0, 1, 2)
    .card:not(.featured)         → (0, 2, 0)
    nav ul li:first-child        → (0, 1, 3)
    #main .content article h2    → (1, 1, 2)
-->
