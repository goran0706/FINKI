<!--
#### Exercise 4.1: Box Model Calculation

Given this CSS, calculate the total rendered width:

.box {
    width: 300px;
    padding: 20px;
    border: 5px solid black;
    margin: 10px;
}

Calculate for:
1. `box-sizing: content-box` (default)
2. `box-sizing: border-box`

-->

content-box width = 300px + 20px * 2 + 5 * 2 = 350px
border-box width = 300px
