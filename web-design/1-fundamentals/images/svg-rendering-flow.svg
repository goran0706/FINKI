<svg width="100%" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg"
     style="background:white; border:1px solid #ddd; border-radius:8px;">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10" fill="#185FA5"/>
        </marker>
    </defs>

    <text x="20" y="30" font-size="18" font-weight="bold" font-family="sans-serif" fill="#2c2c2a">
        Web Page Rendering Process
    </text>

    <!-- Step 1 -->
    <rect x="50" y="60" width="160" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
    <text x="130" y="80" font-size="12" font-weight="bold" font-family="sans-serif" fill="#085041" text-anchor="middle">
        1. DNS Resolution
    </text>
    <text x="130" y="100" font-size="11" font-family="sans-serif" fill="#0F6E56" text-anchor="middle">
        Domain → IP
    </text>

    <!-- Step 2 -->
    <rect x="230" y="60" width="160" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
    <text x="310" y="80" font-size="12" font-weight="bold" font-family="sans-serif" fill="#085041" text-anchor="middle">
        2. TCP Connection
    </text>
    <text x="310" y="100" font-size="11" font-family="sans-serif" fill="#0F6E56" text-anchor="middle">
        3-way Handshake
    </text>

    <path d="M 210 85 L 230 85" stroke="#185FA5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Step 3 -->
    <rect x="410" y="60" width="160" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
    <text x="490" y="80" font-size="12" font-weight="bold" font-family="sans-serif" fill="#085041" text-anchor="middle">
        3. TLS Handshake
    </text>
    <text x="490" y="100" font-size="11" font-family="sans-serif" fill="#0F6E56" text-anchor="middle">
        (HTTPS Only)
    </text>

    <path d="M 390 85 L 410 85" stroke="#185FA5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Step 4 -->
    <rect x="590" y="60" width="160" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
    <text x="670" y="80" font-size="12" font-weight="bold" font-family="sans-serif" fill="#085041" text-anchor="middle">
        4. HTTP Request
    </text>
    <text x="670" y="100" font-size="11" font-family="sans-serif" fill="#0F6E56" text-anchor="middle">
        Send Request
    </text>

    <path d="M 570 85 L 590 85" stroke="#185FA5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Step 5 -->
    <rect x="50" y="140" width="160" height="50" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
    <text x="130" y="160" font-size="12" font-weight="bold" font-family="sans-serif" fill="#BF360C"
          text-anchor="middle">
        5. Server Processing
    </text>
    <text x="130" y="180" font-size="11" font-family="sans-serif" fill="#E65100" text-anchor="middle">
        Generate Response
    </text>

    <!-- Step 6 -->
    <rect x="230" y="140" width="160" height="50" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
    <text x="310" y="160" font-size="12" font-weight="bold" font-family="sans-serif" fill="#BF360C"
          text-anchor="middle">
        6. HTTP Response
    </text>
    <text x="310" y="180" font-size="11" font-family="sans-serif" fill="#E65100" text-anchor="middle">
        Send HTML/CSS/JS
    </text>

    <path d="M 210 165 L 230 165" stroke="#185FA5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Step 7 -->
    <rect x="410" y="140" width="160" height="50" rx="6" fill="#F3E5F5" stroke="#512DA8" stroke-width="2"/>
    <text x="490" y="160" font-size="12" font-weight="bold" font-family="sans-serif" fill="#311B92"
          text-anchor="middle">
        7. HTML Parsing
    </text>
    <text x="490" y="180" font-size="11" font-family="sans-serif" fill="#512DA8" text-anchor="middle">
        Build DOM Tree
    </text>

    <path d="M 390 165 L 410 165" stroke="#185FA5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Step 8 -->
    <rect x="590" y="140" width="160" height="50" rx="6" fill="#F3E5F5" stroke="#512DA8" stroke-width="2"/>
    <text x="670" y="160" font-size="12" font-weight="bold" font-family="sans-serif" fill="#311B92"
          text-anchor="middle">
        8. CSS Parsing
    </text>
    <text x="670" y="180" font-size="11" font-family="sans-serif" fill="#512DA8" text-anchor="middle">
        Build CSSOM Tree
    </text>

    <path d="M 570 165 L 590 165" stroke="#185FA5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Step 9 -->
    <rect x="50" y="220" width="160" height="50" rx="6" fill="#E8F5E9" stroke="#1B5E20" stroke-width="2"/>
    <text x="130" y="240" font-size="12" font-weight="bold" font-family="sans-serif" fill="#1B5E20"
          text-anchor="middle">
        9. Render Tree
    </text>
    <text x="130" y="260" font-size="11" font-family="sans-serif" fill="#2E7D32" text-anchor="middle">
        DOM + CSSOM
    </text>

    <!-- Step 10 -->
    <rect x="230" y="220" width="160" height="50" rx="6" fill="#E8F5E9" stroke="#1B5E20" stroke-width="2"/>
    <text x="310" y="240" font-size="12" font-weight="bold" font-family="sans-serif" fill="#1B5E20"
          text-anchor="middle">
        10. Layout (Reflow)
    </text>
    <text x="310" y="260" font-size="11" font-family="sans-serif" fill="#2E7D32" text-anchor="middle">
        Calculate Positions
    </text>

    <path d="M 210 245 L 230 245" stroke="#185FA5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Step 11 -->
    <rect x="410" y="220" width="160" height="50" rx="6" fill="#E8F5E9" stroke="#1B5E20" stroke-width="2"/>
    <text x="490" y="240" font-size="12" font-weight="bold" font-family="sans-serif" fill="#1B5E20"
          text-anchor="middle">
        11. Painting
    </text>
    <text x="490" y="260" font-size="11" font-family="sans-serif" fill="#2E7D32" text-anchor="middle">
        Rasterize Pixels
    </text>

    <!-- Step 12 -->
    <rect x="590" y="220" width="160" height="50" rx="6" fill="#E8F5E9" stroke="#1B5E20" stroke-width="2"/>
    <text x="670" y="240" font-size="12" font-weight="bold" font-family="sans-serif" fill="#1B5E20"
          text-anchor="middle">
        12. Compositing
    </text>
    <text x="670" y="260" font-size="11" font-family="sans-serif" fill="#2E7D32" text-anchor="middle">
        Layer Assembly
    </text>

    <!-- Final Display -->
    <rect x="200" y="300" width="400" height="60" rx="6" fill="#C8E6C9" stroke="#00695C" stroke-width="3"/>
    <text x="400" y="330" font-size="14" font-weight="bold" font-family="sans-serif" fill="#00695C"
          text-anchor="middle">
        Web Page Displayed to User
    </text>

    <path d="M 670 270 L 670 300 L 400 300" stroke="#185FA5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
</svg>