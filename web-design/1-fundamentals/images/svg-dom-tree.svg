            <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round"
                  stroke-linejoin="round"/>
        </marker>
    </defs>

    <text x="40" y="25" font-size="12" font-family="sans-serif" fill="#73726c">Legend:</text>

    <rect x="100" y="15" width="100" height="20" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="110" y="29" font-size="12" font-family="sans-serif" fill="#185FA5">Element Node</text>

    <rect x="220" y="15" width="100" height="20" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
