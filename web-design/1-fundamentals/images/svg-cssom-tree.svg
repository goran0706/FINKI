<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 600"
     style="background: #ffffff; border: 1px solid #ddd; border-radius: 8px;">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
                orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round"
                  stroke-linejoin="round"/>
        </marker>
    </defs>

    <!-- Legend -->
    <text x="40" y="25" font-size="12" font-family="sans-serif" fill="#73726c">Legend:</text>
    <rect x="100" y="15" width="140" height="20" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="110" y="29" font-size="12" font-family="sans-serif" fill="#185FA5">CSS Node</text>
    <rect x="260" y="15" width="140" height="20" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="270" y="29" font-size="12" font-family="sans-serif" fill="#854F0B">Rule / Declaration</text>

    <!-- CSSStyleSheet -->
    <rect x="340" y="60" width="220" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="450" y="78" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central"
          fill="#444441">CSSStyleSheet
    </text>

    <line x1="450" y1="96" x2="450" y2="135" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- CSSRuleList -->
    <rect x="340" y="135" width="220" height="50" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="450" y="160" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central"
          fill="#0C447C">CSSRuleList
    </text>

    <!-- CSSStyleRule 1 -->
    <rect x="80" y="220" width="220" height="50" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="190" y="245" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central"
          fill="#0C447C">CSSStyleRule: body
    </text>
    <line x1="450" y1="185" x2="190" y2="220" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- CSSStyleDeclaration 1 -->
    <rect x="80" y="280" width="220" height="100" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="190" y="295" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#633806">properties:
    </text>
    <text x="190" y="313" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#633806">margin: 0
    </text>
    <text x="190" y="329" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#633806">padding: 0
    </text>
    <text x="190" y="345" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#633806">font-family:
        Arial, sans-serif
    </text>
    <text x="190" y="361" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#633806">
        background-color: #fff
    </text>

    <!-- CSSStyleRule 2 -->
    <rect x="340" y="220" width="220" height="50" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="450" y="245" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central"
          fill="#0C447C">CSSStyleRule: h1
    </text>
    <line x1="450" y1="185" x2="450" y2="220" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- CSSStyleDeclaration 2 -->
    <rect x="340" y="280" width="220" height="80" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="450" y="295" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#633806">properties:
    </text>
    <text x="450" y="313" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#633806">color: #333
    </text>
    <text x="450" y="329" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#633806">font-size:
        2rem
    </text>
    <text x="450" y="345" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#633806">font-weight:
        bold
    </text>

    <!-- CSSMediaRule -->
    <rect x="600" y="220" width="260" height="50" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="730" y="245" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central"
          fill="#0C447C">@media (max-width: 768px)
    </text>
    <line x1="450" y1="185" x2="730" y2="220" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Nested CSSStyleRule inside @media -->
    <rect x="600" y="280" width="260" height="50" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="730" y="305" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central"
          fill="#0C447C">CSSStyleRule: body
    </text>

    <!-- CSSStyleDeclaration inside @media -->
    <rect x="600" y="340" width="260" height="80" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="730" y="355" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#633806">properties:
    </text>
    <text x="730" y="373" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#633806">font-size:
        14px
    </text>
    <text x="730" y="389" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#633806">padding: 8px
    </text>
</svg>