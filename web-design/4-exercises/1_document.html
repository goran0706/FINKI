<!--
### Exercise 1.1 — Your First HTML Document

**Topic:** Document structure, DOCTYPE, head, body
**What to build:** A bare-bones HTML page about a fictional coffee shop called "Roast & Co."

**Exact requirements:**
 - Create a file called `index.html`
 - Add a valid `<!DOCTYPE html>` declaration
 - Set the language attribute on `<html>` to `en`
 - Inside `<head>`:
    - Set charset to `UTF-8`
    - Set the viewport meta tag for responsive behaviour
    - Set the page title to `Roast & Co. — Specialty Coffee`
    - Inside `<body>`:
 - Add an `<h1>` with the text: `Roast & Co.`
    - Add a `<p>` with the text: `Specialty coffee roasted in small batches since 2010.`
        **Do not add any CSS. Do not add any other elements.**
        **Validate:** Paste into [validator.w3.org](https://validator.w3.org) — zero errors expected.
-->

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Roast & Co. — Specialty Coffee</title>
</head>
<body>
<h1>Roast & Co.</h1>
<p>Specialty coffee roasted in small batches since 2010.</p>
</body>
</html>
