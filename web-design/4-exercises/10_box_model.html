<!--
### Exercise 2.2 — The Box Model

**Topic:** `margin`, `padding`, `border`, `width`, `height`, `box-sizing`
**What to build:** A styled product card using only box model properties — no layout.

**HTML to use (write this exactly):**

<div class="card">
    <div class="card__badge">New</div>
    <h2 class="card__title">Ethiopia Yirgacheffe</h2>
    <p class="card__origin">Origin: Ethiopia</p>
    <p class="card__price">£12.50 / 250g</p>
</div>

**CSS requirements:**
 - `.card`:
     - `width: 320px`
     - `padding: 24px`
     - `border: 2px solid #1a1a1a`
     - `margin: 40px auto`
 - `.card__badge`:
     - `display: inline-block`
     - `padding: 4px 12px`
     - `background-color: #1a1a1a`
     - `color: #ffffff`
     - `font-size: 0.75rem`
     - `margin-bottom: 16px`
 - `.card__title`:
     - `font-size: 1.5rem`
     - `margin: 0 0 8px 0`
 - `.card__origin`:
     - `font-size: 0.875rem`
     - `color: #555555`
     - `margin: 0 0 4px 0`
 - `.card__price`:
     - `font-size: 1.125rem`
     - `font-weight: bold`
     - `margin: 16px 0 0 0`
-->

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Document</title>

    <style>
        .card {
            width: 320px;
            padding: 24px;
            border: 2px solid #1a1a1a;
            margin: 40px auto;
        }

        .card__badge {
            display: inline-block;
            padding: 4px 12px;
            background-color: #1a1a1a;
            color: #ffffff;
            font-size: 0.75rem;
            margin-bottom: 16px;
        }

        .card__title {
            font-size: 1.5rem;
            margin: 0 0 8px 0;
        }

        .card__origin {
            font-size: 0.875rem;
            margin: 0 0 4px 0;
            color: #555555;
        }

        .card__price {
            font-size: 1.125rem;
            font-weight: bold;
            margin: 16px 0 0 0;
        }
    </style>
</head>
<body>

<!-- BEM convention -->
<div class="card">
    <div class="card__badge">New</div>
    <h2 class="card__title">Ethiopia Yirgacheffe</h2>
    <p class="card__origin">Origin: Ethiopia</p>
    <p class="card__price">£12.50 / 250g</p>
</div>

</body>
</html>
